<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Apply - Hot Beans Web</title>

  <style>
  </style>
</head>

<body>

  <a class="home-icon" href="index.html">
    <img src="home.png" alt="Home" />
  </a>

  <h1>Apply</h1>

  <div class="main-content">
    <div class="form-section">
      <form>
        <label>Firstname</label>
        <input type="text" placeholder="Enter your first name" required />

        <label>Surname</label>
        <input type="text" placeholder="Enter your surname" required />

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required />

        <label>Phone number</label>
        <input type="tel" placeholder="Enter your phone number" required />

        <button type="submit">Send</button>
      </form>
    </div>

    <div class="jobs-section">
      <div class="job-card">
        <img src="logo.png" alt="Hot Beans Web Logo" class="job-logo" />
        <div class="job-info">
          <h3>Front End Developer</h3>
          <p>Hot Beans Web - London</p>
          <p class="details">7 days ago • £15-30 an hour • Full-Time</p>
        </div>
      </div>

      <div class="job-card">
        <img src="logo.png" alt="Hot Beans Web Logo" class="job-logo" />
        <div class="job-info">
          <h3>Back End Developer</h3>
          <p>Hot Beans Web - London</p>
          <p class="details">7 days ago • £30-60 an hour • Full-Time</p>
        </div>
      </div>

      <div class="job-card">
        <img src="logo.png" alt="Hot Beans Web Logo" class="job-logo" />
        <div class="job-info">
          <h3>Project Manager</h3>
          <p>Hot Beans Web - London</p>
          <p class="details">7 days ago • £60-80 an hour • Full-Time</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
